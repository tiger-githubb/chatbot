[tool:pytest]
# Configuration pytest simple pour tests basiques
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short
    --disable-warnings

# Marqueurs pour les différents types de tests
markers =
    basic: Tests basiques pour vérifier le projet
    slow: Tests lents qui peuvent prendre du temps
