[tool:pytest]
# Configuration pytest pour Jenkins CI/CD
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short
    --strict-markers
    --disable-warnings
    --no-header
    --junit-xml=test-results.xml
    # Skip integration tests in CI environment
    -m "not (integration and ci)"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    unit: Tests unitaires rapides pour Jenkins CI/CD
    integration: Tests d'intégration (nécessitent des services)
    ci: Tests exécutés dans l'environnement CI
    telegram: Tests qui nécessitent une connexion à l'API Telegram
    aws: Tests qui nécessitent une connexion AWS
    slow: Tests lents ou avec dépendances externes
