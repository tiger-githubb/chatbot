[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --tb=short
# Ajouter le répertoire racine au PYTHONPATH pour les imports src.*
pythonpath = .
# Exclure les outils de production des tests
ignore = tools/test_aws_production.py tools/set_webhook_production.py
