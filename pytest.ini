[tool:pytest]
# Configuration pytest pour Jenkins CI/CD
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short
    --strict-markers
    --disable-warnings
    --no-header
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Tests unitaires rapides
    integration: Tests d'intégration (nécessitent des services)
    slow: Tests lents
