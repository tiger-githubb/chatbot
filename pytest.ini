[tool:pytest]
# Configuration pytest pour Jenkins CI/CD
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short
    --strict-markers
    --disable-warnings
    --no-header
    --junit-xml=test-results.xml
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    unit: Tests unitaires rapides pour Jenkins CI/CD
    integration: Tests d'intégration (nécessitent des services)
    slow: Tests lents ou avec dépendances externes
